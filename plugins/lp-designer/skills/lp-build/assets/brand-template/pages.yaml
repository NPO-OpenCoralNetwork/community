# 参加登録ページの下(フッター)からつなぐ、団体の情報のページ(新しい団体用のひな形)
#
# - ページの名前(about など)が、そのままファイルの名前(about.html)になる
# - 事実は facts.md にあるものだけを使う。決まっていないことは [所在地] のように角括弧で示す
# - draft: true のページは下書き。団体で内容を確かめてから消す(組み立てるたびに「公開の前に決めること」に出る)
# - プライバシーポリシーは、フォームで集める項目、使うサービス、計測のタグに合わせて直す
# - 書き方: lp-build スキルの references/content-guide.md の「pages.yaml」

about:
  title: 団体について | TODO 団体名
  heading: 団体について
  lead: TODO 団体の目的を2〜3文で(content.yaml の mission.statement と合わせる)
  sections:
    - heading: 活動
      items:
        - TODO 活動の名前：1文の説明
    - heading: 団体の情報
