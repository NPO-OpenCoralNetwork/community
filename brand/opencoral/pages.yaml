# 参加登録ページの下(フッター)からつなぐ、団体の情報のページ
#
# - ページの名前(about など)が、そのままファイルの名前(about.html)になる
# - 事実は brand/opencoral/facts.md にあるものだけを使う。決まっていないことは [所在地] のように角括弧で示す
# - draft: true のページは下書き。団体で内容を確かめてから消す(組み立てるたびに「公開の前に決めること」に出る)
# - [計測のタグを使うときだけ] の行は、content.yaml の measure(Google 広告の計測)を使うなら角括弧を消し、使わないなら行ごと消す
# - 書き方: plugins/lp-designer/skills/lp-build/references/content-guide.md の「pages.yaml」
# - 各節は、heading(見出し)、paragraphs(段落)、items(箇条書き)、details(項目と値の表)、notes(小さい文字)の順に表示する

about:
  title: 団体について | NPO法人 Open Coral Network
  heading: 団体について
  lead: 特定非営利活動法人 Open Coral Network は、市民がAIを道具に、まちの身近な課題を見つけ、仲間と解いていくコミュニティを運営しています。話せる居場所づくりにも取り組みます。貢献した人に報酬を払う仕組みをつくり、善意だけに頼らずに続けます。
  sections:
    - heading: 活動
      items:
        - AIの勉強会：AIへの指示の書き方や、AIエージェントの使い方を、その場で動かしながら学びます。
        - まちの課題を解く試み：気になる課題をAIで整理し、何をするかは人が話し合って決めます。
        - 居場所づくり：仕事でも家でもない、ふらっと寄って話せる場所を、参加する人と一緒につくります。
    - heading: 団体の情報
      details:
        - { label: 名称, value: 特定非営利活動法人 <span class="nw">Open Coral Network</span>（オープン・コーラル・ネットワーク） }
        - { label: 法人番号, value: "9230005009484" }
        - { label: 所在地, value: "[所在地]" }
        - { label: 代表者, value: "[代表者の役職と氏名]" }
        - { label: 設立, value: "[設立年月日]" }
        - { label: 連絡先, value: <a href="contact.html">お問い合わせ</a> }

privacy:
  draft: true
  title: プライバシーポリシー | NPO法人 Open Coral Network
  heading: プライバシーポリシー
  lead: 特定非営利活動法人 Open Coral Network（以下「当法人」）は、参加登録やお問い合わせで預かる個人情報を、次のとおり扱います。
  sections:
    - heading: 預かる情報
      paragraphs:
        - 当法人が預かるのは、次の情報です。必要な項目だけを集めます。
      items:
        - 参加登録のフォーム：お名前（ニックネーム可）、メールアドレス、関心のあること（任意）、記録写真に写ってもよいか（任意）
        - お問い合わせ：お名前、メールアドレス、<span class="nw">お問い合わせの内容</span>
        - このウェブサイトの利用状況：広告の効果を測るための情報（クッキーなど）[計測のタグを使うときだけ]
    - heading: 使う目的
      items:
        - 集まりの案内と、参加者のチャットへの招待を送るため
        - お問い合わせに返事をするため
        - 記録写真を使うときに、写ってよいかを確かめるため
        - 広告の効果を測るため[計測のタグを使うときだけ]
      notes:
        - これ以外の目的には使いません。目的を変えるときは、このページでお知らせし、必要なときは本人の同意をいただきます。
    - heading: AIの学習に使わないこと
      paragraphs:
        - 相談の内容や参加者のデータを、AIの学習には使いません。
    - heading: 第三者への提供
      paragraphs:
        - 本人の同意がなければ、個人情報を第三者に渡しません。ただし、法令にもとづく場合は除きます。
    - heading: 外部のサービスの利用
      paragraphs:
        - 次の作業には、外部のサービスを使います。サービスには、作業に必要な範囲でだけ情報を預けます。
      items:
        - フォームの受け付け：[フォームのサービス]
        - メールの送信：[メールのサービス]
        - 参加者のチャット：[チャットのサービス]
        - 広告の効果の計測：Google 広告（Google LLC）[計測のタグを使うときだけ]
        - ページの文字の表示：Google Fonts（Google LLC）
    - heading: 保存する期間
      paragraphs:
        - 預かった情報は、使う目的に必要な間だけ保存し、[保存期間]を過ぎたら消します。
    - heading: 安全のための管理
      items:
        - 情報を扱える人を、作業に必要な人だけに限ります。
        - 個人情報は、チャットや共有の文書にそのまま書かず、暗号化した管理ツールで管理します。
    - heading: 漏えいなどが起きたとき
      paragraphs:
        - 個人情報の漏えいなどが起きたときは、法令にしたがって個人情報保護委員会に報告し、本人に知らせます。
    - heading: 見せてほしい、直してほしい、消してほしいとき
      paragraphs:
        - 自分の情報を見せてほしい、直してほしい、消してほしい、使うのをやめてほしいときは、<a href="contact.html">お問い合わせ</a>の窓口にご連絡ください。本人であることを確かめてから、法令にしたがって対応します。
        - 参加はいつでもやめられます。参加登録を取り消すときも、同じ窓口にご連絡ください。
    - heading: お問い合わせの窓口
      details:
        - { label: 名称, value: 特定非営利活動法人 <span class="nw">Open Coral Network</span> }
        - { label: 所在地, value: "[所在地]" }
        - { label: 代表者, value: "[代表者の役職と氏名]" }
        - { label: 連絡先, value: <a href="contact.html">お問い合わせ</a> }
    - heading: このポリシーを変えるとき
      paragraphs:
        - 内容を変えるときは、このページでお知らせします。
  footnote: 制定：[制定日]

contact:
  title: お問い合わせ | NPO法人 Open Coral Network
  heading: お問い合わせ
  lead: このコミュニティと団体へのお問い合わせは、次の窓口で受け付けています。
  sections:
    - heading: 窓口
      details:
        - { label: メール, value: "[問い合わせ先のメールアドレス]" }
      notes:
        - 参加をやめたいとき、登録した情報を直したり消したりしたいときも、この窓口にご連絡ください。
        - お問い合わせで預かった情報は、<a href="privacy.html">プライバシーポリシー</a>にしたがって扱います。
    - heading: 参加登録
      paragraphs:
        - 参加登録は、<a href="./#join">トップページのフォーム</a>から受け付けています。
